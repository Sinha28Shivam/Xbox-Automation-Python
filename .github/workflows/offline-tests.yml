# Offline regression suite for Xbox-Agentic-Testing.
#
# Runs on every push and pull request. Needs no Xbox, GIMX, capture card, LLM
# key or network: every test fakes hardware and stubs the LLM. A failure here
# means a code change broke learning, reporting, guided navigation or Dungeons
# combat logic before anyone touched a console.
name: offline-tests

on:
  push:
    paths:
      - "Xbox-Agentic-Testing/**"
      - "Xbox-Automation-Python/config/**"
      - ".github/workflows/offline-tests.yml"
  pull_request:
    paths:
      - "Xbox-Agentic-Testing/**"
      - "Xbox-Automation-Python/config/**"
      - ".github/workflows/offline-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Xbox-Agentic-Testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Xbox-Agentic-Testing/requirements.lock

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip install "ruff>=0.6" "mypy>=1.11" "pytest-cov>=5" types-PyYAML

      - name: Compile every module
        run: python -m compileall -q agents core tools gameplay graph console.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy, core + agents)
        run: mypy

      - name: Run offline tests (with coverage)
        run: |
          python -m pytest -v --cov --cov-report=
          python -m coverage combine -q
          python -m coverage report --skip-empty
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: Xbox-Agentic-Testing/coverage.xml
