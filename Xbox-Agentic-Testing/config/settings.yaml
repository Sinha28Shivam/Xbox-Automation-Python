meta:
  version: 2
  description: "Multi-agent console testing runtime settings"

llm:
  provider: "${AGENTIC_LLM_PROVIDER:anthropic}"
  providers:
    anthropic:
      module: "langchain_anthropic"
      class: "ChatAnthropic"
      api_key_env: "ANTHROPIC_API_KEY"
      params:
        model: "${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}"
        temperature: 0
        # A 12-stage journey plan is 40-60 steps of structured JSON, which
        # exceeds 8192 output tokens. When the cap is hit the model returns
        # nothing usable and the planner silently falls back to the 7-stage
        # bootstrap - which looks like a planning failure but is really
        # output truncation.
        max_tokens: "${ANTHROPIC_MAX_TOKENS:32000}"
      supports_vision: true
    openai:
      module: "langchain_openai"
      class: "ChatOpenAI"
      api_key_env: "OPENAI_API_KEY"
      params:
        model: "${OPENAI_MODEL:gpt-4o}"
        temperature: 0
      supports_vision: true
    google:
      module: "langchain_google_genai"
      class: "ChatGoogleGenerativeAI"
      api_key_env: "GOOGLE_API_KEY"
      params:
        model: "${GOOGLE_MODEL:gemini-2.0-flash}"
        temperature: 0
      supports_vision: true
    ollama:
      module: "langchain_ollama"
      class: "ChatOllama"
      api_key_env: null
      params:
        model: "${OLLAMA_MODEL:llama3.2}"
        temperature: 0
      supports_vision: false

paths:
  automation_root: "${AUTOMATION_ROOT:../Xbox-Automation-Python}"
  controls_config: "${CONTROLS_CONFIG:../Xbox-Automation-Python/config/controls.yaml}"
  scenarios_dir: "${SCENARIOS_DIR:./scenarios}"
  prompts_dir: "${PROMPTS_DIR:./config/prompts}"
  artifacts_dir: "${ARTIFACTS_DIR:./artifacts}"
  reports_dir: "${REPORTS_DIR:./artifacts/reports}"

adapters:
  gimx:
    file: "gimx-session/gimx_session.py"
    module_name: "gimx_session"
    exports: ["GimxSession", "session_is_up", "running_gimx_pids", "stop_all"]
  pad:
    file: "test-controller/test_controller.py"
    module_name: "test_controller"
    exports: ["ConsolePad", "ControlConfig"]
  capture:
    file: "capture/capture.py"
    module_name: "capture"
    exports: ["ScreenCapture", "preflight", "frame_stats", "is_blank", "difference"]

runtime:
  execution_mode: "${EXECUTION_MODE:scenario}" # scenario | level | campaign
  max_steps: "${MAX_STEPS:250}"
  max_steps_scenario: 40
  max_steps_level: 250
  max_steps_campaign: 1000
  max_replans: "${MAX_REPLANS:1}"
  step_timeout_seconds: 60
  run_timeout_seconds: "${RUN_TIMEOUT:3600}"
  level_timeout_seconds: 3600
  campaign_timeout_seconds: 14400
  recursion_limit: 500
  dry_run: "${DRY_RUN:false}"
  require_visual_evidence: true
  stop_on_health_failure: true
  save_frames: true
  frame_format: "png"
  dead_input_streak: 3

# ---------------------------------------------------------------------------
# GAMEPLAY / MENU NAVIGATION
# Used by gameplay/menu_navigator.py for vision-guided launching.
# ---------------------------------------------------------------------------
gameplay:
  menu:
    # Menu screens per navigation: dashboard -> logo -> title -> main menu ->
    # SELECT LEVEL -> chapter list -> level -> loading is ~8, and a few get
    # spent on vetoed confirms and animation waits.
    max_cycles: "${MENU_MAX_CYCLES:25}"
    # Seconds to let a menu finish animating before the next screenshot.
    # Too small and the model reads a half-drawn transition.
    settle_seconds: 1.5
    # A hung provider call would otherwise freeze the launch silently.
    llm_timeout_seconds: 90.0
    press_duration: 0.2
    # After a CONFIRM, wait for the pixels to prove the screen actually moved
    # before deciding anything else. Without this the next cycle reads the
    # OLD screen and confirms the same item twice - which launched the wrong
    # level (a second A fell through onto the level list).
    confirm_timeout: 8.0
    change_poll: 0.3
    change_delta: 6.0
    # A d-pad HIGHLIGHT MOVE is verified the same way, but measured
    # differently: one menu row is a tiny fraction of the frame, so a mean
    # delta averages it away into noise. Count strongly-changed pixels
    # instead. Not verifying moves is what made the launcher press down twice
    # (CONTINUE -> SELECT LEVEL -> OPTIONS) and then confirm Options.
    move_timeout: 2.5
    move_pixel_fraction: 0.0015
    move_pixel_delta: 30
  report:
    # Frame pairs the AI audits per mechanic. Each pair is one vision call
    # with two images, so 6 mechanics x 2 is the cost ceiling per report.
    # Raising it gives a mechanic more chances to be confirmed.
    max_pairs: "${REPORT_MAX_PAIRS:2}"

verification:
  screen_change_threshold: 0.5
  stability_timeout: 10.0
  stability_settle: 0.4
  blank_std_threshold: 1.0
  ocr:
    enabled: "${OCR_ENABLED:true}"
    engines: ["pytesseract"]
    min_confidence: 0.4

reporting:
  # The four step-by-step writers (json/markdown/html/junit) were deleted.
  # "mechanics" is now the only report: a per-mechanic PASS / FAILED /
  # NOT TESTED / INCONCLUSIVE verdict with screenshots and an AI audit.
  # It emits its own markdown, html and json. Empty this list to disable
  # reporting entirely.
  formats: ["mechanics"]
  include_frames: true
  include_action_log: true
  include_transcript: true

logging:
  level: "${LOG_LEVEL:INFO}"
  rich_console: true
  log_file: "${LOG_FILE:./artifacts/agentic.log}"
