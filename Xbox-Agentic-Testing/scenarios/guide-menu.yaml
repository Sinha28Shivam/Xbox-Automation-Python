id: guide-menu-opens
title: The Guide button opens the guide overlay
description: >
  Press the Xbox Guide button and verify that the guide overlay appears with
  recognizable guide menu elements.

console: xbox_one

preconditions:
  - The console is on and awake
  - The GIMX session is authenticated
  - The console is on the home dashboard or inside a game

success_criteria:
  - description: >
      The screen changes substantially after the Guide button is pressed,
      consistent with the guide overlay opening.
    check_type: screen_change
    parameters:
      button: guide
      min_delta: 2.0
    required: true

  - description: >
      The Xbox guide overlay is visible with guide menu elements such as
      Home, Share last capture, My games & apps, or the power-options hint.
    check_type: vision_judgement
    parameters:
      expected_screen: Xbox guide overlay
    required: true

  - description: >
      Guide menu text such as 'Home' or 'My games & apps' is visible.
    check_type: text_present
    parameters:
      text: My games & apps
    required: false

  - description: >
      No error dialog or 'Something went wrong' message is visible on the guide.
    check_type: no_error_dialog
    required: true

tags:
  - smoke
  - guide
  - overlay

timeout_seconds: 90
max_steps: 10
