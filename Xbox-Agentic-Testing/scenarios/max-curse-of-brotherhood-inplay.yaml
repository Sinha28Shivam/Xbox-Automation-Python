# ===========================================================================
# Scenario: Max: The Curse of Brotherhood - launch, select Anotherland, play
# ===========================================================================
# Run from Xbox-Agentic-Testing:
#   python console.py run --file scenarios/max-curse-of-brotherhood-inplay.yaml
# ===========================================================================

id: max-curse-of-brotherhood-inplay
title: "Max: The Curse of Brotherhood - launch, select Chapter 1 Anotherland, and play"
description: >
  Start from the Xbox dashboard, automatically locate Max: The Curse of
  Brotherhood on tile 1 or tile 2 using visual evidence, launch it, wait for
  the game to become interactive, open the game's level-selection menu, select
  Chapter 1: Anotherland, and then play forward using closed-loop visual
  feedback. Some Max levels are already completed, so do not assume a fresh
  save or reset progress.

console: xbox_one

execution:
  mode: scenario
  max_steps: 250
  max_replans: 5
  timeout_seconds: 3600
  require_visual_evidence: true
  save_frames: true
  stop_on_unproven_progress: true
  recover_from_death: true

preconditions:
  - The console/device is powered on and awake
  - The GIMX session is authenticated and connected
  - The Android/cloud-gaming session is visible through the configured capture adapter
  - The user is signed in
  - The Xbox dashboard is visible before execution
  - Max: The Curse of Brotherhood is available on dashboard tile 1 or tile 2
  - Some Max levels may already be completed; do not reset progress or assume a fresh save

launch:
  game_name: "Max: The Curse of Brotherhood"
  max_tiles: 2
  discovery_required: true
  launch_required: true
  launch_verification:
    required: true
    expected_screens:
      - "Max: The Curse of Brotherhood loading, splash, title, or startup screen"
      - "Max: The Curse of Brotherhood main menu or interactive game screen"
    benign_dialogs:
      - "Cloud Storage sync"
      - "loading"
    rule: >
      Use automatic game discovery. Inspect tile 1 first and tile 2 only if
      tile 1 does not match. Press A only after the requested title is visually
      matched. If neither tile matches, fail without launching another game.
      After A, wait for a stable screen and verify that Max has actually started.

level_selection:
  required: true
  menu_state:
    description: >
      Reach the Max level/chapter selection screen where previously completed
      and available levels can be selected.
    expected_visual: >
      A visible Max level-selection/chapter-selection menu containing level or
      chapter entries.
    success_criteria:
      - "The level/chapter selection menu is visibly open."
      - "The menu is interactive and not a loading or error screen."

  target:
    chapter: 1
    level_title: "Anotherland"
    display_name: "Chapter 1: Anotherland"
    selection_required: true
    selection_rule: >
      Do not assume the current highlight is Chapter 1: Anotherland. Read the
      visible menu and determine which entry is focused. Navigate with the
      appropriate directional input, one movement at a time, re-capturing the
      screen after each movement. Stop only when the focused/highlighted entry
      is visually identified as Chapter 1: Anotherland. Then select it with A.
    verification:
      required: true
      expected_visual: >
        Chapter 1: Anotherland is visibly highlighted/selected before A is
        pressed, and after A the game transitions into that level.

play:
  required: true
  objective: >
    Play Chapter 1: Anotherland from the selected level using controller input
    and visual feedback. Continue only when the resulting screen provides
    enough evidence to understand the current state.
  control_policy:
    closed_loop: true
    one_action_per_step: true
    observe_after_transition: true
    wait_for_stable_screen: true
    no_fixed_button_script: true
    no_unverified_progress: true
  capabilities:
    movement:
      description: "Use the left stick to move Max and verify visible position or animation changes."
    jump:
      description: "Use the jump control when required and verify a visible jump/airborne state."
    draw_mechanic:
      description: >
        Use the right-stick draw mechanic when the visible puzzle requires it.
        Infer the required direction/shape from the current visual state and
        verify the resulting world change before continuing.
    puzzle_solving:
      description: >
        Prefer observable cause-and-effect: perform one action, observe the
        result, and re-plan when the expected state is not reached.
    checkpoint_progress:
      description: >
        Treat a visibly reached checkpoint or other strong level-progress
        signal as verified progress and preserve the evidence frame when available.
    death_recovery:
      description: >
        If a death/restart state is visibly detected, wait for the checkpoint
        restart state, verify gameplay is active, and re-plan from the observed state.
        Do not blindly repeat the previous action sequence.

success_criteria:
  - description: >
      Max: The Curse of Brotherhood is selected on dashboard tile 1 or tile 2
      and is launched only after the title is visually identified.
    check_type: vision_judgement
    parameters:
      expected_screen: "Max: The Curse of Brotherhood launch/loading/title screen"
    required: true

  - description: >
      The game reaches an interactive main menu or gameplay state.
    check_type: vision_judgement
    parameters:
      expected_screen: "Max: The Curse of Brotherhood interactive menu or gameplay"
    required: true

  - description: >
      The level/chapter selection menu is visible.
    check_type: vision_judgement
    parameters:
      expected_screen: "Max chapter/level selection menu"
    required: true

  - description: >
      Chapter 1: Anotherland is visually identified as the focused/selected level.
    check_type: vision_judgement
    parameters:
      expected_visual: "Chapter 1: Anotherland is highlighted/focused"
    required: true

  - description: >
      After selecting Chapter 1: Anotherland, an interactive level/gameplay
      screen is reached rather than a loading, black, or error screen.
    check_type: vision_judgement
    parameters:
      expected_screen: "Anotherland interactive gameplay"
    required: true

  - description: >
      Left-stick movement produces a visible change in Max's position or
      animation, proving controller input reaches gameplay.
    check_type: screen_change
    parameters:
      input: left_stick
      min_delta: 1.0
    required: true

  - description: >
      A jump input produces visible airborne movement or a jump animation.
    check_type: vision_judgement
    parameters:
      expected_visual: "Max is airborne or visibly performing a jump"
    required: true

  - description: >
      At least one visible puzzle interaction using the game's draw mechanic
      produces a meaningful screen/world change.
    check_type: screen_change
    parameters:
      input: right_stick
      min_delta: 1.0
    required: true

  - description: >
      Continued play produces a verified progress signal such as reaching a
      checkpoint, clearing a puzzle/obstacle, collecting a visible relic, or
      advancing to a new gameplay state.
    check_type: vision_judgement
    parameters:
      expected_visual: "Visible evidence of forward level progress"
    required: true

  - description: >
      The level-complete, chapter-complete, or level-summary screen becomes
      visible before the execution budget expires.
    check_type: vision_judgement
    parameters:
      expected_screen: "Level complete, chapter complete, or level summary"
    required: false

  - description: >
      No unrecovered error dialog, connection failure, or 'Something went
      wrong' state remains visible during the run.
    check_type: no_error_dialog
    required: true

failure_policy:
  wrong_game_detected: >
    Stop immediately if visual evidence identifies another game as the focused
    tile at the point where launch is attempted.
  game_not_found: >
    Stop without pressing A if Max cannot be visually identified on tile 1 or tile 2.
  anotherland_not_found: >
    Do not guess a menu position. Re-observe and re-plan. If Chapter 1:
    Anotherland cannot be visually identified within the execution budget,
    report the run as inconclusive/fail rather than selecting an arbitrary level.
  death: >
    Recover only from a visibly confirmed death/restart state and re-plan from
    the resulting checkpoint/gameplay state.
  loading: >
    Wait for stable screen detection; do not spend gameplay actions while a
    known launch/loading/sync state is still changing.

artifacts:
  capture_launch_frames: true
  capture_tile_discovery: true
  capture_level_menu: true
  capture_anotherland_selection: true
  capture_progress_frames: true
  capture_action_log: true

# These scenario limits are intentionally explicit for real-hardware testing.
# The framework may also apply the global runtime limits from config/settings.yaml.
timeout_seconds: 3600
max_steps: 250
